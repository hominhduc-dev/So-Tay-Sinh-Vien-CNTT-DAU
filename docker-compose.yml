# Chạy server + CSDL: docker compose up --build  →  server TCP socket ở cổng 9090.
# Client desktop chạy riêng trên từng máy: java -jar client/target/tangthu-client.jar <IP máy chủ> 9090
# Cấu hình bằng tệp .env cùng thư mục (chép từ .env.example).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tangthu
      POSTGRES_USER: tangthu
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Đặt DB_PASSWORD trong .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tangthu -d tangthu"]
      interval: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/tangthu
      DB_USER: tangthu
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET (≥ 32 ký tự) trong .env}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
    volumes:
      - storage:/data/storage
    ports:
      - "${SOCKET_PORT:-9090}:9090"   # cổng TCP socket, mở cho các máy trong LAN
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
  storage: {}
