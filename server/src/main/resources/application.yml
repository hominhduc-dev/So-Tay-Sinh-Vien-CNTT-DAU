spring:
  application:
    name: tangthu-server
  main:
    web-application-type: none   # không chạy Tomcat; client nối qua TCP socket
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tangthu}
    username: ${DB_USER:tangthu}
    password: ${DB_PASSWORD:tangthu}
  jpa:
    hibernate:
      ddl-auto: validate          # lược đồ do Flyway quản lý
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # Bỏ classpath:db/demo khi triển khai thật (dữ liệu demo có mật khẩu chung).
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET}         # ≥ 32 byte, bắt buộc
    ttl: ${JWT_TTL:PT8H}
  storage-dir: ${STORAGE_DIR:./storage}
  department: ${APP_DEPARTMENT:CNTT}
  socket:
    port: ${SOCKET_PORT:9090}
    threads: ${SOCKET_THREADS:64}
    max-frame-mb: 32               # đủ cho tệp 20 MB đã mã hóa base64
    idle-timeout: ${SOCKET_IDLE_TIMEOUT:PT30M}
